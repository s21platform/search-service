syntax = "proto3";

import "google/protobuf/timestamp.proto";

option go_package = "pkg/search";

service SearchService {
  rpc GetUser (GetUserIn) returns (GetUserOut);
}

message StringArray {
  repeated string values = 1;
}

message Filter {
  oneof value{
    string string_value = 1;
    int32 int_value = 2;
    bool bool_value = 3;
    StringArray array_value = 4;
  }
}

message GetUserIn {
  string query = 1;
  map<string, Filter> filters = 2;
  int32 page = 3;
  int32 pageSize =4;
}

message UserInfo{
  string UUID = 1;
  string Nickname = 2;
}

message GetUserOut {
  repeated UserInfo users = 1;
}

